name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    quality:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4
            
            - name: Setup uv
              uses: astral-sh/setup-uv@v5
              with:
                enable-cache: true
            
            - name: Install dependencies
              run: uv sync --dev --frozen
            
            - name: Lint
              run: uv run --frozen ruff check .
            
            - name: Type check
              run: uv run --frozen mypy src

            - name: Test
              run: uv run --frozen pytest -q --cov=ai_agent_lab --cov-report=term-missing --cov-fail-under=80
              